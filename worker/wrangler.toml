# SchoolToDo 텔레그램 봇 + 알림 Worker
# 정본은 이 레포. 배포: worker/ 에서 `npx wrangler deploy`
# 대시보드 Quick Edit 로 고치지 말 것 (2026-04 네스트 브리핑 코드 유실 사고의 원인).

name = "schooltodo-bot"
main = "src/index.js"
compatibility_date = "2026-02-22"
workers_dev = true

# 평문 변수. 여기 없으면 deploy 시 대시보드의 값이 지워진다.
[vars]
SUPABASE_URL = "https://sprrelvxxgvrdkmplidu.supabase.co"

# Secrets (대시보드에 이미 등록됨, deploy 해도 유지됨). 새로 넣을 땐 `npx wrangler secret put <NAME>`
#   BRIEFING_APPS_SCRIPT_URL  SUPABASE_SERVICE_ROLE_KEY  (OPENAI_API_KEY 는 v2-4 부터 안 씀, 대시보드에서 지워도 됨)
#   TELEGRAM_BOT_TOKEN  VAPID_PRIVATE_KEY  VAPID_PUBLIC_KEY  VAPID_SUBJECT
#   HEALTH_KEY (관리용 GET 주소 ?key=)   TELEGRAM_WEBHOOK_SECRET (webhook 헤더 검사)  ← 2026-10-10 추가, 없으면 예전처럼 열림
#   ANTHROPIC_API_KEY — 봇 대화·사진 분석 전부 (필수). 없으면 슬래시 명령과 Cron 알림만 동작

# Cron: 5분마다 한 번. 시각 판단은 코드(scheduled)에서 KST 로 한다.
#   07:10            네스트 브리핑 (Apps Script → Google Tasks)
#   사용자 설정 시각   아침 = 오늘 할 일, 저녁 = 내일 할 일 (profiles.notification_morning/evening, 기본 07:30 / 21:00)
#   11:00~17:59 평일  픽업 1시간 전 · 정각 알림 (쉬는 날은 건너뜀)
# 2026-10-10 이전엔 고정 Cron 4개(22:30/22:10/12:00 UTC + */10 2-9)였다.
# 사진이 조용해지면 자기 자신에게 새 요청을 띄워 분석한다 (src/collect.js).
# 기다린 12초가 분석 시간을 깎지 않게 하려는 것. 바인딩이 없으면 같은 요청 안에서 분석한다.
[[services]]
binding = "SELF"
service = "schooltodo-bot"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
